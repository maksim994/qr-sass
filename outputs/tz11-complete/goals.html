<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ТЗ11 — проверка целей</title><script src="/__tz11-observe.js"></script></head><body><h1>ТЗ11 · реальные SDK</h1><p>Синтетические события из исходной функции приложения trackGoal().</p><button id="enable">Включить обе категории</button><button data-goal="registration_completed">Регистрация</button><button data-goal="dynamic_enabled">Динамический QR</button><button data-goal="pricing_view">Тарифы</button><button data-goal="checkout_started">Начало оплаты</button><button data-goal="payment_succeeded">Успешная оплата</button><pre id="status">Загрузка исходников приложения…</pre><script type="module">
