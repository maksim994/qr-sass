# Coolify / Docker Compose для qr-s.ru
# ВАЖНО: данные хранятся в именованных томах (postgres_data, redis_data).
# При обновлении приложения тома НЕ удаляются — данные сохраняются.

services:
  init-db:
    build:
      context: .
      target: builder
    entrypoint: ["node", "scripts/migrate-deploy.mjs"]
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/qr_saas?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/qr_saas?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_PREVIOUS_SECRET=${JWT_PREVIOUS_SECRET:-}
      - JWT_ROTATED_AT=${JWT_ROTATED_AT:-}
      - APP_URL=${APP_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - S3_PUBLIC_OMIT_BUCKET=${S3_PUBLIC_OMIT_BUCKET:-true}
      - S3_PREFIX=${S3_PREFIX:-qr}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:-}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ADMIN_INTEGRATIONS_KEY=${ADMIN_INTEGRATIONS_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - ANALYTICS_RETENTION_DAYS=${ANALYTICS_RETENTION_DAYS:-90}
    depends_on:
      init-db:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      target: runner
    entrypoint: ["node", "--experimental-strip-types", "--import", "./scripts/register-src-alias.mjs", "scripts/notification-worker.ts"]
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/qr_saas?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - APP_URL=${APP_URL}
      - ADMIN_INTEGRATIONS_KEY=${ADMIN_INTEGRATIONS_KEY:-}
    depends_on:
      init-db:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  analytics-purge:
    build:
      context: .
      target: runner
    entrypoint:
      [
        "node",
        "--experimental-strip-types",
        "--import",
        "./scripts/register-src-alias.mjs",
        "scripts/purge-analytics-loop.ts",
      ]
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/qr_saas?schema=public
      - ANALYTICS_RETENTION_DAYS=${ANALYTICS_RETENTION_DAYS:-90}
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: qr_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  # Именованные тома — данные сохраняются при пересборке и обновлении
  postgres_data:
  redis_data:
