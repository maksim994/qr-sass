      "ArticlePublishBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Только QRS_ARTICLES_PUBLISH_TOKEN из окружения сервера. Редакционные, QR-ключи и cookie не подходят. Пустая переменная и неверный ключ — 403. Ключ подходит только для POST publish."
      },
      "QrApiKey": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "qrs_api_…",
        "description": "Ключ кабинета QR API; QR endpoints не принимают cookie, qre_ или редакционные ключи."
      }
