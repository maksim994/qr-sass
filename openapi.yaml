{
  "openapi": "3.1.0",
  "info": {
    "title": "QR-S API",
    "version": "1.6.0",
    "description": "Редакционные ключи управляются в /admin/blog/tokens. Только Bearer, 60 запросов/минуту, без публикации/удаления/расписания. Отдельный POST publish требует QRS_ARTICLES_PUBLISH_TOKEN и точную version, лимит 10 публикаций за скользящий час. Пустая переменная выключает публикацию. Сохранение статьи создаёт версию с автором API: <имя ключа>; публикация — с автором api. Черновик изменений хранится отдельно и публикуется только администратором. Отозванные редакционные ключи возвращают 401. Ответы с данными private,no-store. Публичная схема не содержит данных или секретов. QR API v1: qrs_api_ ключи, scopes qr:read/qr:write/stats:read, Бесплатный/Про/Бизнес с общими лимитами QR кабинета. Создание динамических URL; текст, Wi-Fi, телефон в модуле создаются статически локально.",
    "license": {
      "name": "Proprietary",
      "identifier": "LicenseRef-Proprietary"
    }
  },
  "servers": [
    {
      "url": "https://qr-s.ru"
    }
  ],
  "tags": [
    {
      "name": "Articles",
      "description": "Чтение и изменение статей"
    },
    {
      "name": "Redirects",
      "description": "Редакционные 301 и прежние системные правила"
    },
    {
      "name": "Images",
      "description": "Загрузка WebP и изменение alt с версией статьи"
    },
    {
      "name": "QR",
      "description": "Динамические QR, изображения и агрегированная статистика"
    }
  ],
