    "/api/v1/articles/{id}/images": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "post": {
        "operationId": "uploadArticleImage",
        "summary": "Загрузить изображение и создать версию",
        "security": [
          {
            "ArticleBearer": []
          }
        ],
        "tags": [
          "Images"
        ],
        "description": "JPEG/PNG/GIF/WebP ≤10 MiB, ≤40 млн пикселей; GIF — первый кадр. WebP 480/960/1600 без увеличения. kind=cover обновляет обложку/alt; content дописывает figure в Markdown (HTML требует явной предварительной конвертации). version обязательна, 409 при конфликте. Статус статьи сохраняется, публикация запрещена. Объекты в прежнем S3, публичные url/variants/srcset/figure на qr-s.ru/media/blog/. Исходные файлы не меняются.",
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "required": [
                  "file",
                  "alt",
                  "kind",
                  "version"
                ],
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary"
                  },
                  "alt": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 1000
                  },
                  "kind": {
                    "type": "string",
                    "enum": [
                      "cover",
                      "content"
                    ]
                  },
                  "version": {
                    "type": "integer",
                    "minimum": 0,
                    "description": "Последний номер редакционной версии. 0 до первого сохранения истории. PATCH и POST publish требуют точное совпадение; конфликт — 409."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Изображение и сохранённая статья",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "ok",
                    "data"
                  ],
                  "properties": {
                    "ok": {
                      "const": true
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "image": {
                          "$ref": "#/components/schemas/BlogImage"
                        },
                        "article": {
                          "$ref": "#/components/schemas/Article"
                        }
                      },
                      "required": [
                        "image",
                        "article"
                      ]
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Некорректный запрос / JSON-LD",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Нет действующего ключа",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
