            "description": "JSON-LD: объект, JSON-строка объекта, null или пустая строка для удаления. Невалидный JSON — 400.",
            "oneOf": [
              {
                "type": "object",
                "additionalProperties": true
              },
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "faq": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "question",
                "answer"
              ],
              "properties": {
                "question": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 500
                },
                "answer": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 10000,
                  "description": "Inline Markdown: ссылки, жирный и курсив; без заголовков, изображений и HTML. Ссылки только /... (не //...) и https://. Внешние: rel=noopener nofollow, target=_blank. FAQPage содержит чистый текст."
                }
              }
            }
          },
          "showPrintSizeIntro": {
            "type": "boolean"
          },
          "confirmConversion": {
            "type": "boolean",
            "description": "Явное подтверждение html→markdown; исходный HTML сохраняется в legacyHtml."
          },
          "comment": {
            "type": "string",
            "maxLength": 2000
          },
          "version": {
            "type": "integer",
            "minimum": 0,
            "description": "Необязательный номер живой версии для защиты от устаревшего чтения. Черновик не увеличивает номер истории."
          }
        }
      },
      "ArticlePendingRevision": {
        "type": "object",
        "required": [
