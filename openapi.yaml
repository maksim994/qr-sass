          "contentType",
          "shortCode",
          "shortUrl",
          "targetUrl",
          "source",
          "createdAt",
          "updatedAt",
          "moderationStatus",
          "holdUntilCheck"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "kind": {
            "type": "string"
          },
          "contentType": {
            "type": "string"
          },
          "shortCode": {
            "type": [
              "string",
              "null"
            ]
          },
          "shortUrl": {
            "type": [
              "string",
              "null"
            ]
          },
          "targetUrl": {
            "type": [
              "string",
              "null"
            ]
          },
          "source": {
            "type": [
              "string",
              "null"
            ]
          },
          "createdAt": {
            "type": "string",
