{
  "openapi": "3.1.0",
  "info": {
    "title": "QR-S Article API",
    "version": "1.0.0",
    "description": "Редакционные ключи управляются в /admin/blog/tokens. Только Bearer, 60 запросов/минуту, без публикации/удаления/расписания. Все записи создают версию с автором API: <имя ключа>. Отозванные ключи возвращают 401. Ответы с данными private,no-store. Публичная схема не содержит данных или секретов.",
    "license": {
      "name": "Proprietary",
      "identifier": "LicenseRef-Proprietary"
    }
  },
  "servers": [
    {
      "url": "https://qr-s.ru"
    }
  ],
  "tags": [
    {
      "name": "Articles",
      "description": "Чтение и изменение статей"
    }
  ],
  "paths": {
    "/api/v1/articles": {
      "get": {
        "operationId": "listArticles",
        "summary": "Список статей",
        "security": [
          {
            "ArticleBearer": []
          }
        ],
        "tags": [
          "Articles"
        ],
        "parameters": [
          {
            "name": "status",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "draft",
                "scheduled",
                "published"
              ]
            }
          },
          {
            "name": "slug",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 200
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 1000000,
              "default": 1
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Список",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "ok",
                    "data"
                  ],
                  "properties": {
                    "ok": {
                      "const": true
                    },
                    "data": {
                      "type": "object",
                      "required": [
                        "items",
                        "total",
                        "page",
                        "limit"
                      ],
                      "properties": {
                        "items": {
                          "type": "array",
                          "items": {
                            "$ref": "#/components/schemas/ArticleSummary"
                          }
                        },
                        "total": {
                          "type": "integer"
                        },
                        "page": {
                          "type": "integer"
                        },
                        "limit": {
                          "type": "integer"
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Некорректный запрос / JSON-LD",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Нет действующего ключа",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Запрещённая операция / опубликованный slug",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Статья не найдена",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Конфликт версии или slug",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "60 запросов в минуту",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "Retry-After": {
                "description": "Секунд до следующего окна",
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          },
          "500": {
            "description": "Ошибка сервера",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "createArticle",
        "summary": "Создать черновик",
        "security": [
          {
            "ArticleBearer": []
          }
        ],
        "tags": [
          "Articles"
        ],
        "description": "Переданный status игнорируется: результат всегда draft. published/publishedAt/scheduledAt не принимаются (400). format по умолчанию markdown.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ArticleCreate"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Черновик создан",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "ok",
                    "data"
                  ],
                  "properties": {
                    "ok": {
                      "const": true
                    },
                    "data": {
                      "$ref": "#/components/schemas/Article"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Некорректный запрос / JSON-LD",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Нет действующего ключа",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Запрещённая операция / опубликованный slug",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Статья не найдена",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Конфликт версии или slug",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "60 запросов в минуту",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "Retry-After": {
                "description": "Секунд до следующего окна",
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          },
          "500": {
            "description": "Ошибка сервера",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/articles/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "get": {
        "operationId": "getArticle",
        "summary": "Все поля статьи и номер версии",
        "security": [
          {
            "ArticleBearer": []
          }
        ],
        "tags": [
          "Articles"
        ],
        "responses": {
          "200": {
            "description": "Статья",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "ok",
                    "data"
                  ],
                  "properties": {
                    "ok": {
                      "const": true
                    },
                    "data": {
                      "$ref": "#/components/schemas/Article"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Некорректный запрос / JSON-LD",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Нет действующего ключа",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Запрещённая операция / опубликованный slug",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Статья не найдена",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Конфликт версии или slug",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "60 запросов в минуту",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "Retry-After": {
                "description": "Секунд до следующего окна",
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          },
          "500": {
            "description": "Ошибка сервера",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "patch": {
        "operationId": "patchArticle",
        "summary": "Изменить статью",
        "security": [
          {
            "ArticleBearer": []
          }
        ],
        "tags": [
          "Articles"
        ],
        "description": "version обязательна. Можно менять опубликованный текст, FAQ, JSON-LD, метаданные и изображения с alt. Статус/даты публикации/расписание — 403 даже при прежнем значении. Изменение slug после первой публикации — 403. DELETE/PUT отсутствуют (405).",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ArticlePatch"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Новая версия сохранена",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "ok",
                    "data"
                  ],
                  "properties": {
                    "ok": {
                      "const": true
                    },
                    "data": {
                      "$ref": "#/components/schemas/Article"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Некорректный запрос / JSON-LD",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Нет действующего ключа",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Запрещённая операция / опубликованный slug",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Статья не найдена",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Конфликт версии или slug",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "60 запросов в минуту",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "Retry-After": {
                "description": "Секунд до следующего окна",
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          },
          "500": {
            "description": "Ошибка сервера",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "ArticleBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "qrs_blog_<secret>"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "ok",
          "error",
          "code"
        ],
        "properties": {
          "ok": {
            "const": false
          },
          "error": {
            "type": "string",
            "description": "Сообщение по-русски"
          },
          "code": {
            "type": "string"
          }
        }
      },
      "ArticleSummary": {
        "type": "object",
        "required": [
          "id",
          "slug",
          "title",
          "status",
          "format",
          "version"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "slug": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "draft",
              "scheduled",
              "published"
            ]
          },
          "format": {
            "type": "string",
            "enum": [
              "html",
              "markdown"
            ]
          },
          "version": {
            "type": "integer",
            "minimum": 0,
            "description": "Последний номер редакционной версии. 0 до первого сохранения истории. PATCH требует точное совпадение; конфликт — 409."
          },
          "excerpt": {
            "type": [
              "string",
              "null"
            ]
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "contentUpdatedAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "publishedAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "scheduledAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        }
      },
      "Article": {
        "type": "object",
        "required": [
          "id",
          "slug",
          "title",
          "status",
          "format",
          "version"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "slug": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200,
            "description": "Нормализуется в lowercase a-z0-9-. Нельзя менять после первой публикации."
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          },
          "status": {
            "type": "string",
            "enum": [
              "draft",
              "scheduled",
              "published"
            ]
          },
          "format": {
            "type": "string",
            "enum": [
              "html",
              "markdown"
            ]
          },
          "version": {
            "type": "integer",
            "minimum": 0,
            "description": "Последний номер редакционной версии. 0 до первого сохранения истории. PATCH требует точное совпадение; конфликт — 409."
          },
          "excerpt": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 10000
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "contentUpdatedAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "publishedAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "scheduledAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "content": {
            "type": "string",
            "maxLength": 1000000,
            "description": "Исходный HTML или Markdown, inline images: ![alt](https://…). Старый HTML меняется только при явном переходе на Markdown с confirmConversion=true."
          },
          "metaTitle": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 500
          },
          "metaDescription": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 2000
          },
          "coverImageUrl": {
            "type": [
              "string",
              "null"
            ],
            "description": "HTTP(S) URL обложки; null/пустая строка убирает обложку."
          },
          "coverImageAlt": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 1000
          },
          "authorName": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 300
          },
          "categoryId": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 200
          },
          "readingTimeMinutes": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 1,
            "maximum": 999
          },
          "structuredData": {
            "type": [
              "string",
              "null"
            ]
          },
          "faq": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "question",
                "answer"
              ],
              "properties": {
                "question": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 500
                },
                "answer": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 10000
                }
              }
            }
          },
          "showPrintSizeIntro": {
            "type": "boolean"
          },
          "renderedHtml": {
            "type": [
              "string",
              "null"
            ]
          },
          "legacyHtml": {
            "type": [
              "string",
              "null"
            ]
          },
          "firstPublishedAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "views": {
            "type": "integer"
          },
          "likes": {
            "type": "integer"
          },
          "createdById": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "ArticleCreate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "title",
          "slug",
          "content"
        ],
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          },
          "slug": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200,
            "description": "Нормализуется в lowercase a-z0-9-. Нельзя менять после первой публикации."
          },
          "content": {
            "type": "string",
            "maxLength": 1000000,
            "description": "Исходный HTML или Markdown, inline images: ![alt](https://…). Старый HTML меняется только при явном переходе на Markdown с confirmConversion=true."
          },
          "format": {
            "type": "string",
            "enum": [
              "html",
              "markdown"
            ]
          },
          "metaTitle": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 500
          },
          "metaDescription": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 2000
          },
          "excerpt": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 10000
          },
          "coverImageUrl": {
            "type": [
              "string",
              "null"
            ],
            "description": "HTTP(S) URL обложки; null/пустая строка убирает обложку."
          },
          "coverImageAlt": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 1000
          },
          "authorName": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 300
          },
          "categoryId": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 200
          },
          "readingTimeMinutes": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 1,
            "maximum": 999
          },
          "structuredData": {
            "description": "JSON-LD: объект, JSON-строка объекта, null или пустая строка для удаления. Невалидный JSON — 400.",
            "oneOf": [
              {
                "type": "object",
                "additionalProperties": true
              },
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "faq": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "question",
                "answer"
              ],
              "properties": {
                "question": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 500
                },
                "answer": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 10000
                }
              }
            }
          },
          "showPrintSizeIntro": {
            "type": "boolean"
          },
          "minorEdit": {
            "type": "boolean",
            "description": "Сохраняет редакционную дату. No-op/пробелы сохраняют дату независимо от флага."
          },
          "confirmConversion": {
            "type": "boolean",
            "description": "Явное подтверждение html→markdown; исходный HTML сохраняется в legacyHtml."
          },
          "comment": {
            "type": "string",
            "maxLength": 2000
          },
          "status": {
            "type": "string",
            "enum": [
              "draft",
              "scheduled",
              "published"
            ]
          }
        }
      },
      "ArticlePatch": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version"
        ],
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          },
          "slug": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200,
            "description": "Нормализуется в lowercase a-z0-9-. Нельзя менять после первой публикации."
          },
          "content": {
            "type": "string",
            "maxLength": 1000000,
            "description": "Исходный HTML или Markdown, inline images: ![alt](https://…). Старый HTML меняется только при явном переходе на Markdown с confirmConversion=true."
          },
          "format": {
            "type": "string",
            "enum": [
              "html",
              "markdown"
            ]
          },
          "metaTitle": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 500
          },
          "metaDescription": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 2000
          },
          "excerpt": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 10000
          },
          "coverImageUrl": {
            "type": [
              "string",
              "null"
            ],
            "description": "HTTP(S) URL обложки; null/пустая строка убирает обложку."
          },
          "coverImageAlt": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 1000
          },
          "authorName": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 300
          },
          "categoryId": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 200
          },
          "readingTimeMinutes": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 1,
            "maximum": 999
          },
          "structuredData": {
            "description": "JSON-LD: объект, JSON-строка объекта, null или пустая строка для удаления. Невалидный JSON — 400.",
            "oneOf": [
              {
                "type": "object",
                "additionalProperties": true
              },
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "faq": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "question",
                "answer"
              ],
              "properties": {
                "question": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 500
                },
                "answer": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 10000
                }
              }
            }
          },
          "showPrintSizeIntro": {
            "type": "boolean"
          },
          "minorEdit": {
            "type": "boolean",
            "description": "Сохраняет редакционную дату. No-op/пробелы сохраняют дату независимо от флага."
          },
          "confirmConversion": {
            "type": "boolean",
            "description": "Явное подтверждение html→markdown; исходный HTML сохраняется в legacyHtml."
          },
          "comment": {
            "type": "string",
            "maxLength": 2000
          },
          "version": {
            "type": "integer",
            "minimum": 0,
            "description": "Последний номер редакционной версии. 0 до первого сохранения истории. PATCH требует точное совпадение; конфликт — 409."
          }
        }
      }
    }
  }
}
