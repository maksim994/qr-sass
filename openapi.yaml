            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "actorName": {
            "type": "string"
          }
        }
      },
      "ArticlePublish": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 0,
            "description": "Последний номер редакционной версии. 0 до первого сохранения истории. PATCH и POST publish требуют точное совпадение; конфликт — 409."
